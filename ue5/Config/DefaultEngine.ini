; Hanoi City engine defaults. Lines marked VERIFY are checked on first open (docs/05-tich-hop-ue5.md).

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Hanoi.Hanoi
GameDefaultMap=/Game/Maps/Hanoi.Hanoi

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen GI + reflections, Virtual Shadow Maps, Nanite-friendly, no baked lighting (dynamic time of day).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=True
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.Nanite.ProjectEnabled=True
; MegaLights (many-light street lamps / neon signs). VERIFY the cvar name in 5.8 Project Settings > Rendering.
r.MegaLights.EnableForProject=True
r.VirtualTextures=True
r.CustomDepth=3

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Generates the unreal.py stub (Intermediate/PythonStub) for IDE completion of editor scripts.
bDeveloperMode=True
; Lets external tools (community unreal-mcp servers, VS Code) run Python in the editor over UDP/TCP on localhost.
bRemoteExecution=True

[Core.Log]
LogHanoi=Log
