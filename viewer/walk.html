<title>Dạo phố Cầu Giấy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-screen street scene; HUD chips pinned to the corners. */
:root {
  --hud-bg: rgba(250, 250, 246, 0.86);
  --hud-fg: #1d2420;
  --hud-muted: #56615a;
  --hud-line: rgba(29, 36, 32, 0.14);
  --accent: #8a5a00;
  --bg: #c9d3d8;
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-data: "Roboto Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hud-bg: rgba(20, 24, 21, 0.84); --hud-fg: #e5e8e2; --hud-muted: #9aa59e;
    --hud-line: rgba(229, 232, 226, 0.14); --accent: #e8b960; --bg: #1a1f1b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --hud-bg: rgba(20, 24, 21, 0.84); --hud-fg: #e5e8e2; --hud-muted: #9aa59e;
  --hud-line: rgba(229, 232, 226, 0.14); --accent: #e8b960; --bg: #1a1f1b; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--hud-fg); font-family: var(--f-ui); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.hud { position: fixed; background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.45; backdrop-filter: blur(6px); }
.hud.tl { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; max-width: min(360px, calc(100% - 24px)); }
.hud.bl { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; max-width: 560px; display: grid; gap: 6px; }
h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
h1 span { font-family: var(--f-data); font-weight: 500; color: var(--accent); }
.keys { color: var(--hud-muted); margin-top: 4px; }
kbd { font-family: var(--f-data); font-size: 11px; border: 1px solid var(--hud-line); border-radius: 4px; padding: 0 4px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row label { color: var(--hud-muted); }
#hour { flex: 1 1 160px; min-width: 0; accent-color: var(--accent); }
#hour-out, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
#where { color: var(--hud-muted); min-width: 0; overflow-wrap: anywhere; }
#where b { color: var(--hud-fg); font-weight: 500; }
a { color: var(--accent); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font-size: 15px; z-index: 5; }
#loading div { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 0 16px; }
#loading b { font-size: 20px; font-weight: 800; }
#stick { position: fixed; left: 24px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); width: 110px; height: 110px; border-radius: 50%; border: 2px solid var(--hud-line); background: var(--hud-bg); touch-action: none; }
#stick i { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); opacity: 0.8; }
@media (hover: hover) and (pointer: fine) { #stick { display: none; } }
</style>

<canvas id="scene" tabindex="0" aria-label="Phố Cầu Giấy góc nhìn thứ ba"></canvas>

  <h1>Cầu Giấy <span>1:1</span></h1>
  <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> đi bộ · giữ <kbd>Shift</kbd> để chạy · kéo chuột để xoay · cuộn để đổi khoảng cách</div>
</div>

<div class="hud bl">
  <div class="row">
    <label for="hour">Giờ</label>
    <input id="hour" type="range" min="5.5" max="19" step="0.25" value="15.5">
    <span id="hour-out">15:30</span>
  </div>
  <div id="where">Đang xác định vị trí…</div>
</div>
<div id="stick" aria-hidden="true"><i></i></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { Sky } from "three/addons/objects/Sky.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// ---------- constants grounded in the place ----------
const LAT_DEG = 21.03, DAY_OF_YEAR = 284;   // Hà Nội, mid-October
const FLOOR_M = 3.3;
const WALK_MS = 1.4, RUN_MS = 4.2;         // real pedestrian speeds
const BODY_R = 0.3;
const WALL_COLORS = ["#e3b04b", "#efe6d2", "#e8c4c0", "#bfd4dc", "#f2f2ee", "#cfe3cf", "#b9b6ae", "#e9d7a6", "#d8cfc0", "#f0d9b5"];
const SIGNS = ["PHỞ BÒ", "CƠM BÌNH DÂN", "TẠP HÓA", "SỬA XE MÁY", "CÀ PHÊ", "BÁNH MÌ", "NHÀ THUỐC", "ĐIỆN THOẠI", "BÚN CHẢ", "PHOTO COPY", "TRÀ ĐÁ", "GỘI ĐẦU"];
const SIGN_BG = ["#c8242b", "#f2c230", "#1f5fa8", "#1d7a46", "#e86a1a", "#ffffff"];
const MAIN_ROADS = new Set(["trunk", "primary", "secondary", "tertiary"]);
const SHOP_ROADS = new Set(["trunk", "primary", "secondary", "tertiary", "residential", "unclassified", "service", "living_street"]);

const $ = (id) => document.getElementById(id);
const LITE = location.hash === "#lite";        // no shadows, 1x pixels: for weak GPUs and phones
const loadMsg = (t) => { $("load-msg").textContent = t; };

// ---------- deterministic randomness per building ----------
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngFor(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pick = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];

// ---------- renderer, sky, sun ----------
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(LITE ? 1 : Math.min(window.devicePixelRatio, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.shadowMap.enabled = !LITE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 3000);
const sky = new Sky();
sky.scale.setScalar(5000);
Object.assign(sky.material.uniforms, {});
sky.material.uniforms.turbidity.value = 9;      // humid, hazy Hà Nội air
sky.material.uniforms.rayleigh.value = 1.6;
sky.material.uniforms.mieCoefficient.value = 0.012;
sky.material.uniforms.mieDirectionalG.value = 0.82;
scene.add(sky);
scene.fog = new THREE.Fog(0xc4ccd0, 60, LITE ? 300 : 520);   // Hà Nội haze also hides the draw range

const hemi = new THREE.HemisphereLight(0xdfe8f0, 0x6b6257, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 500 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
const sunDir = new THREE.Vector3();

function solar(hour) {
  // Declination and hour angle for local solar time at Hà Nội's latitude.
  const decl = THREE.MathUtils.degToRad(23.44) * Math.sin((2 * Math.PI / 365) * (DAY_OF_YEAR - 81));
  const lat = THREE.MathUtils.degToRad(LAT_DEG);
  const ha = THREE.MathUtils.degToRad(15 * (hour - 12));
  const sinEl = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  const el = Math.asin(sinEl);
  let az = Math.acos(Math.min(1, Math.max(-1, (Math.sin(decl) - Math.sin(el) * Math.sin(lat)) / (Math.cos(el) * Math.cos(lat)))));
  if (ha > 0) az = 2 * Math.PI - az;                 // afternoon: sun in the west
  return { el, az };
}
const windowLitMat = new THREE.MeshStandardMaterial({ color: 0x2b3238, roughness: 0.2, metalness: 0.5, emissive: 0xffc070, emissiveIntensity: 0 });
function setHour(h) {
  const { el, az } = solar(h);
  sunDir.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
  sky.material.uniforms.sunPosition.value.copy(sunDir);
  const day = THREE.MathUtils.clamp(Math.sin(el) * 3, 0, 1);
  sun.intensity = 3.2 * day;
  sun.color.setHSL(0.09, 0.6, 0.55 + 0.35 * day);
  hemi.intensity = 0.25 + 0.75 * day;
  scene.fog.color.setHSL(0.56, 0.12, 0.2 + 0.58 * day);
  windowLitMat.emissiveIntensity = (1 - day) * 1.6;
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  $("hour-out").textContent = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}
$("hour").addEventListener("input", (e) => setHour(parseFloat(e.target.value)));

// ---------- canvas textures ----------
function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const grimeTex = canvasTex(256, 256, (g, w, h) => {
  // Plaster with rain streaks and a darker damp band at street level (u = 4 m, v = 4 m).
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
  const r = rngFor(7);
  for (let i = 0; i < 2600; i++) { const v = 225 + r() * 30; g.fillStyle = `rgba(${v},${v},${v},0.3)`; g.fillRect(r() * w, r() * h, 2 + r() * 5, 2 + r() * 5); }
  for (let i = 0; i < 26; i++) { const x = r() * w; const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, "rgba(90,85,78,0.09)"); grd.addColorStop(1, "rgba(90,85,78,0)"); g.fillStyle = grd; g.fillRect(x, 0, 2 + r() * 7, h * (0.3 + r() * 0.7)); }
}, true);
const shutterTex = canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = "#9aa0a3"; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 6) { g.fillStyle = "#7e8487"; g.fillRect(0, y, w, 2); g.fillStyle = "#b6bbbd"; g.fillRect(0, y + 2, w, 1); }
}, true);
const flagTex = canvasTex(96, 64, (g, w, h) => {
  g.fillStyle = "#da251d"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#ffcd00"; g.beginPath();
  const cx = w / 2, cy = h / 2, R = h * 0.3, r = R * 0.382;
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5; const rr = i % 2 ? r : R; g.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); }
  g.fill();
});
function signTex(text, bg) {
  return canvasTex(512, 96, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(0,0,0,0.25)"; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
    g.fillStyle = bg === "#ffffff" || bg === "#f2c230" ? "#c8242b" : "#ffffff";
    g.font = "800 58px 'Be Vietnam Pro', 'Segoe UI', sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(text, w / 2, h / 2 + 3, w - 30);
  });
}

// ---------- data loading ----------
const loader = new GLTFLoader();
async function fetchGlb(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const bin = atob((await res.text()).trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
// data metres (east, north) -> three (x, z = -north)
const V = (x, y, h = 0) => new THREE.Vector3(x, h, -y);

// ---------- builders ----------
const buildings = [];           // {poly:[[x,y]..], name, height, source, id}
const grid = new Map();         // collision grid of building polygons
const CELL = 25;
const cellKey = (cx, cy) => `${cx},${cy}`;
function addToGrid(b) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of b.poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  b.bbox = [x0, y0, x1, y1];
  for (let cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++)
    for (let cy = Math.floor(y0 / CELL); cy <= Math.floor(y1 / CELL); cy++) {
      const k = cellKey(cx, cy); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(b);
    }
}
function ccw(poly) {
  let a = 0; for (let i = 0; i < poly.length - 1; i++) a += poly[i][0] * poly[i + 1][1] - poly[i + 1][0] * poly[i][1];
  return a >= 0 ? poly : poly.slice().reverse();
}

// Everything generated is bucketed into 200 m chunks: each chunk is frustum-culled and hidden
// beyond the draw range, so only the streets around the walker cost anything.
const CHUNK = 200;
const chunks = new Map();
function chunk(x, y) {
  const cx = Math.floor(x / CHUNK), cy = Math.floor(y / CHUNK), k = cellKey(cx, cy);
  if (!chunks.has(k)) chunks.set(k, { cx: (cx + 0.5) * CHUNK, cy: (cy + 0.5) * CHUNK, wall: { pos: [], nor: [], col: [], uv: [] }, roof: [], inst: {}, cables: [], group: null });
  return chunks.get(k);
}
function pushQuad(c, a, b, h0, h1, n, col, u0, u1) {
  const p = [[a[0], a[1], h0], [b[0], b[1], h0], [b[0], b[1], h1], [a[0], a[1], h0], [b[0], b[1], h1], [a[0], a[1], h1]];
  const uv = [[u0, h0 / 4], [u1, h0 / 4], [u1, h1 / 4], [u0, h0 / 4], [u1, h1 / 4], [u0, h1 / 4]];
  for (let i = 0; i < 6; i++) {
    c.wall.pos.push(p[i][0], p[i][2], -p[i][1]); c.wall.nor.push(n[0], 0, -n[1]);
    c.wall.col.push(col.r, col.g, col.b); c.wall.uv.push(uv[i][0], uv[i][1]);
  }
}

const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), P = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function put(kind, x, y, h, yaw, sx, sy, sz, color) {
  Q.setFromAxisAngle(UP, yaw); P.set(x, h, -y); S.set(sx, sy, sz);
  (chunk(x, y).inst[kind] ||= []).push({ m: M.clone().compose(P, Q, S), c: color });
}
const poles = [], treeCells = new Set(), poleCells = new Set();
const spawnEdges = [];          // shopfronts on everyday streets: where a walk should start

function addBuilding(raw, ox, oy) {
  const r = rngFor(hashStr(raw.id));
  const poly = ccw(raw.footprint.map(([x, y]) => [x + ox, y + oy]));
  const base = raw.min_height_m || 0, top = raw.height_m;
  const tall = raw.floors >= 7;
  const wall = new THREE.Color(tall ? pick(r, ["#cfd6da", "#b9c3c8", "#e6e4dc"]) : pick(r, WALL_COLORS));
  wall.multiplyScalar(0.92 + r() * 0.12);
  const ch = chunk(poly[0][0], poly[0][1]);
  let u = 0;
  for (let i = 0; i < poly.length - 1; i++) {
    const a = poly[i], b = poly[i + 1];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < 1e-3) continue;
    pushQuad(ch, a, b, base, top, [dy / L, -dx / L], wall, u / 4, (u + L) / 4);
    u += L;
  }
  // roof (flat concrete)
  const contour = poly.slice(0, -1).map(([x, y]) => new THREE.Vector2(x, y));
  for (const [i, j, k] of THREE.ShapeUtils.triangulateShape(contour, [])) {
    for (const t of [i, j, k]) ch.roof.push(contour[t].x, top, -contour[t].y);
  }
  const b = { poly, name: raw.name, height: top, source: raw.height_source, id: raw.id };
  buildings.push(b); addToGrid(b);

  // facades along streets
  for (const e of raw.street_edges) {
    const ax = e.a[0] + ox, ay = e.a[1] + oy, bx = e.b[0] + ox, by = e.b[1] + oy;
    const L = e.len, dx = (bx - ax) / L, dy = (by - ay) / L, nx = dy, ny = -dx;
    const yaw = Math.atan2(-dy, dx) ;          // three yaw so local +x runs along the facade
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const at = (t, off) => [ax + dx * t + nx * off, ay + dy * t + ny * off];
    const floors = Math.max(1, Math.min(raw.floors, Math.floor((top - base) / FLOOR_M)));
    const shopRoad = SHOP_ROADS.has(e.road);
    if (!tall && L >= 4 && (e.road === "tertiary" || e.road === "residential" || e.road === "secondary"))
      spawnEdges.push({ x: mx + nx * 2.2, y: my + ny * 2.2, dx, dy });

    if (!tall && shopRoad && L >= 2.4) {
      // ground floor: open shop or roller shutter, sign board above
      const [sx, sy] = at(L / 2, 0.04);
      if (r() < 0.45) put("shutter", sx, sy, 1.55, yaw, L * 0.86, 3.1, 1);
      else put("shopdark", sx, sy, 1.5, yaw, L * 0.86, 3.0, 1);
      const [gx, gy] = at(L / 2, 0.22);
      put(`sign${Math.floor(r() * SIGNS.length)}`, gx, gy, 3.45, yaw, Math.min(L * 0.92, 9), 0.75, 0.16);
      // motorbikes parked nose-in, stools for street food
      if (MAIN_ROADS.has(e.road) || e.road === "residential" || e.road === "unclassified") {
        const n = Math.floor(r() * Math.min(5, L / 0.8));
        for (let k = 0; k < n; k++) {
          const [px, py] = at(0.6 + k * 0.75 + r() * 0.15, 1.3 + r() * 0.3);
          put("bike", px, py, 0, yaw + Math.PI / 2 + (r() - 0.5) * 0.2, 1, 1, 1, new THREE.Color(pick(r, ["#b3121b", "#1b1b1b", "#e9e9e9", "#1f4fa0", "#7a7f86", "#c9a227"])));
        }
        if (r() < 0.22) {
          for (let k = 0; k < 4 + Math.floor(r() * 4); k++) {
            const [px, py] = at(r() * L, 1.0 + r() * 2.2);
            put("stool", px, py, 0, r() * 6, 1, 1, 1, new THREE.Color(pick(r, ["#1f6fd1", "#d12f2f", "#1f6fd1"])));
          }
        }
      }
      if (r() < 0.12) { const [fx, fy] = at(0.4, 0.5); put("flag", fx, fy, 4.6, yaw, 1.2, 0.8, 1); }
    }
    // upper floors
    const winCount = Math.max(1, Math.floor(L / 2.4));
    for (let f = tall ? 0 : 1; f < floors; f++) {
      const h0 = base + f * FLOOR_M;
      for (let w = 0; w < winCount; w++) {
        const t = (w + 0.5) * (L / winCount);
        const [wx, wy] = at(t, 0.03);
        put(r() < 0.3 ? "winLit" : "win", wx, wy, h0 + 1.7, yaw, tall ? L / winCount * 0.92 : 1.3, tall ? 2.6 : 1.55, 1);
      }
      if (!tall && L >= 2.4) {
        const [bx2, by2] = at(L / 2, 0.45);
        put("slab", bx2, by2, h0 + 0.06, yaw, L - 0.4, 0.12, 0.9);
        const [rx, ry] = at(L / 2, 0.88);
        put("rail", rx, ry, h0 + 0.6, yaw, L - 0.4, 0.95, 0.04);
        if (r() < 0.55) { const [cx, cy] = at(0.55, 0.6); put("ac", cx, cy, h0 + 0.45, yaw, 1, 1, 1); }
      }
      if (tall) { const [sx, sy] = at(L / 2, 0.05); put("band", sx, sy, h0, yaw, L, 0.35, 0.12); }
    }
    // rooftop water tank (Sơn Hà style, stainless, lying on a frame)
    if (!tall && r() < 0.7 && L >= 2.4) {
      const [tx, ty] = at(L / 2, -1.6);
      put("tank", tx, ty, top + 0.85, yaw, 1, 1, 1);
    }
    // trees on main-road sidewalks, poles and cables along alleys
    if (MAIN_ROADS.has(e.road)) {
      for (let t = 4; t < L; t += 10) {
        const [px, py] = at(t, 3.6);
        const k = cellKey(Math.round(px / 7), Math.round(py / 7));
        if (treeCells.has(k)) continue; treeCells.add(k);
        const s = 0.8 + r() * 0.5;
        put("trunk", px, py, 0, 0, s, s, s);
        for (let c = 0; c < 4; c++) put("canopy", px + (r() - 0.5) * 2.4 * s, py + (r() - 0.5) * 2.4 * s, (4.6 + r() * 2.2) * s, r() * 6, 1.6 * s + r(), 1.2 * s + r() * 0.6, 1.6 * s + r(), new THREE.Color().setHSL(0.27 + r() * 0.06, 0.45, 0.22 + r() * 0.1));
      }
    }
    if (e.road === "service" || e.road === "residential" || e.road === "unclassified" || MAIN_ROADS.has(e.road)) {
      const [px, py] = at(L / 2, MAIN_ROADS.has(e.road) ? 4.8 : 0.7);
      const k = cellKey(Math.round(px / 22), Math.round(py / 22));
      if (!poleCells.has(k)) { poleCells.add(k); poles.push([px, py]); put("pole", px, py, 0, 0, 1, 1, 1); }
    }
  }
}

function cables() {
  // Each pole strings 4-7 sagging cables to its two nearest neighbours: the Hà Nội tangle.
  const pg = new Map();
  poles.forEach((p, i) => { const k = cellKey(Math.floor(p[0] / 40), Math.floor(p[1] / 40)); if (!pg.has(k)) pg.set(k, []); pg.get(k).push(i); });
  const done = new Set();
  poles.forEach((p, i) => {
    const cx = Math.floor(p[0] / 40), cy = Math.floor(p[1] / 40), near = [];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (const j of pg.get(cellKey(cx + a, cy + b)) || []) {
      if (j === i) continue; const d = Math.hypot(poles[j][0] - p[0], poles[j][1] - p[1]); if (d < 38) near.push([d, j]);
    }
    near.sort((x, y) => x[0] - y[0]);
    for (const [, j] of near.slice(0, 2)) {
      const key = i < j ? `${i}-${j}` : `${j}-${i}`; if (done.has(key)) continue; done.add(key);
      const r = rngFor(i * 7919 + j);
      const q = poles[j], n = 4 + Math.floor(r() * 4), pts = chunk(p[0], p[1]).cables;
      for (let c = 0; c < n; c++) {
        const h0 = 6.3 + r() * 1.6, h1 = 6.3 + r() * 1.6, sag = 0.5 + r() * 1.3, off = (r() - 0.5) * 0.5;
        let prev = null;
        for (let s = 0; s <= 10; s++) {
          const t = s / 10, x = p[0] + (q[0] - p[0]) * t + off, y = p[1] + (q[1] - p[1]) * t + off;
          const h = h0 + (h1 - h0) * t - sag * 4 * t * (1 - t);
          const v = [x, h, -y]; if (prev) pts.push(...prev, ...v); prev = v;
        }
      }
    }
  });
}

// ---------- instanced prop geometry ----------
function boxGeo(w, h, d, oy = 0) { const g = new THREE.BoxGeometry(w, h, d); g.translate(0, oy, 0); return g; }
function tint(g, hex) { const c = new THREE.Color(hex); const n = g.attributes.position.count; g.setAttribute("color", new THREE.Float32BufferAttribute(new Array(n).fill(0).flatMap(() => [c.r, c.g, c.b]), 3)); return g; }
function bikeGeo() {
  const body = tint(boxGeo(1.75, 0.32, 0.36, 0.62), "#ffffff");
  const seat = tint(boxGeo(0.7, 0.1, 0.3, 0.84), "#1a1a1a"); seat.translate(-0.25, 0, 0);
  const shield = tint(boxGeo(0.12, 0.55, 0.42, 0.7), "#ffffff"); shield.translate(0.62, 0, 0);
  const bar = tint(boxGeo(0.08, 0.06, 0.72, 1.08), "#202020"); bar.translate(0.66, 0, 0);
  const w1 = tint(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 14).rotateX(Math.PI / 2).translate(0.62, 0.3, 0), "#111111");
  const w2 = w1.clone().translate(-1.24, 0, 0);
  return mergeGeometries([body, seat, shield, bar, w1, w2]);
}
function tankGeo() {
  const tank = tint(new THREE.CylinderGeometry(0.48, 0.48, 1.7, 18).rotateZ(Math.PI / 2), "#ffffff");
  const legs = tint(boxGeo(1.4, 0.5, 0.7, -0.6), "#4a4a4a");

}
function poleGeo() {
  const shaft = tint(new THREE.CylinderGeometry(0.11, 0.17, 8.6, 8).translate(0, 4.3, 0), "#9b978f");
  const arm = tint(boxGeo(1.4, 0.1, 0.1, 7.6), "#6b6862");
  const box1 = tint(boxGeo(0.35, 0.5, 0.3, 5.4), "#7d8086"); box1.translate(0.2, 0, 0);

}
function stoolGeo() { return tint(new THREE.CylinderGeometry(0.15, 0.18, 0.45, 10).translate(0, 0.225, 0), "#ffffff"); }
function acGeo() { const g = tint(boxGeo(0.82, 0.56, 0.3), "#e9e9e6"); const fan = tint(new THREE.CylinderGeometry(0.19, 0.19, 0.02, 14).rotateX(Math.PI / 2).translate(0.12, 0, 0.16), "#555"); return mergeGeometries([g, fan]); }

const std = (o) => new THREE.MeshStandardMaterial({ roughness: 0.85, ...o });
const PROPS = {
  shutter: [new THREE.PlaneGeometry(1, 1), std({ map: shutterTex, metalness: 0.4, roughness: 0.6 })],
  shopdark: [new THREE.PlaneGeometry(1, 1), std({ color: 0x2a221b, roughness: 0.95 })],
  win: [new THREE.PlaneGeometry(1, 1), std({ color: 0x2b3238, roughness: 0.2, metalness: 0.5 })],
  winLit: [new THREE.PlaneGeometry(1, 1), windowLitMat],
  slab: [new THREE.BoxGeometry(1, 1, 1), std({ color: 0xd9d4ca })],
  rail: [new THREE.BoxGeometry(1, 1, 1), std({ color: 0x2f3437, metalness: 0.6, roughness: 0.5 })],
  band: [new THREE.BoxGeometry(1, 1, 1), std({ color: 0x8b9397 })],
  ac: [acGeo(), std({ vertexColors: true })],
  tank: [tankGeo(), std({ vertexColors: true, color: 0xd6dadc, metalness: 0.8, roughness: 0.3 })],
  bike: [bikeGeo(), std({ vertexColors: true, metalness: 0.3, roughness: 0.45 })],
  stool: [stoolGeo(), std({ vertexColors: true, roughness: 0.5 })],
  pole: [poleGeo(), std({ vertexColors: true })],
  trunk: [new THREE.CylinderGeometry(0.14, 0.22, 5.2, 7).translate(0, 2.6, 0), std({ color: 0x5b4a3a })],
  canopy: [new THREE.IcosahedronGeometry(1, 1), std({ color: 0xffffff, roughness: 0.9, flatShading: true })],
  flag: [new THREE.PlaneGeometry(1, 1), std({ map: flagTex, side: THREE.DoubleSide })],
};
SIGNS.forEach((text, i) => { PROPS[`sign${i}`] = [new THREE.BoxGeometry(1, 1, 1), std({ map: signTex(text, SIGN_BG[i % SIGN_BG.length]), roughness: 0.6 })]; });
const NO_SHADOW = new Set(["win", "winLit", "shutter", "shopdark", "flag"]);

const wallMat = std({ vertexColors: true, map: grimeTex, side: THREE.DoubleSide, roughness: 0.92 });
const roofMat = std({ color: 0x8f8b84, side: THREE.DoubleSide });
const cableMat = new THREE.LineBasicMaterial({ color: 0x151515 });
function buildChunks() {
  for (const c of chunks.values()) {
    const g = new THREE.Group();
    if (c.wall.pos.length) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(c.wall.pos, 3));
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(c.wall.nor, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(c.wall.col, 3));
      geo.setAttribute("uv", new THREE.Float32BufferAttribute(c.wall.uv, 2));
      const m = new THREE.Mesh(geo, wallMat); m.castShadow = m.receiveShadow = true; g.add(m);
    }
    if (c.roof.length) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(c.roof, 3));
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, roofMat); m.castShadow = m.receiveShadow = true; g.add(m);
    }
    for (const [kind, list] of Object.entries(c.inst)) {
      const [geo, mat] = PROPS[kind];
      const mesh = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach((it, i) => { mesh.setMatrixAt(i, it.m); if (it.c) mesh.setColorAt(i, it.c); });
      mesh.computeBoundingSphere();
      mesh.castShadow = !NO_SHADOW.has(kind); mesh.receiveShadow = true;
      g.add(mesh);
    }
    if (c.cables.length) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(c.cables, 3));
      g.add(new THREE.LineSegments(geo, cableMat));
    }
    c.group = g; c.wall = c.roof = c.inst = c.cables = null;   // release the build arrays
    scene.add(g);
  }
}
const DRAW_RANGE = LITE ? 280 : 480;
function cullChunks() {
  for (const c of chunks.values()) c.group.visible = Math.hypot(c.cx - player.x, c.cy - player.y) < DRAW_RANGE + CHUNK * 0.71;
}

// ---------- character ----------
function makeWalker() {
  const g = new THREE.Group();
  const skin = std({ color: 0xd9a77f }), shirt = std({ color: 0xf2f2ee }), pants = std({ color: 0x1f2328 }), bag = std({ color: 0x6d7378 }), hair = std({ color: 0x18120e });
  const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  part(new THREE.BoxGeometry(0.42, 0.58, 0.24), shirt, 0, 1.22, 0);
  part(new THREE.SphereGeometry(0.13, 16, 12), skin, 0, 1.66, 0);
  part(new THREE.SphereGeometry(0.135, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), hair, 0, 1.68, 0);
  part(new THREE.BoxGeometry(0.34, 0.44, 0.17), bag, 0, 1.24, 0.2);
  const limb = (w, h, mat, x, y) => { const pivot = new THREE.Group(); pivot.position.set(x, y, 0); const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat); m.position.y = -h / 2; m.castShadow = true; pivot.add(m); g.add(pivot); return pivot; };
  const legs = [limb(0.15, 0.9, pants, -0.1, 0.92), limb(0.15, 0.9, pants, 0.1, 0.92)];
  const arms = [limb(0.1, 0.58, shirt, -0.27, 1.48), limb(0.1, 0.58, shirt, 0.27, 1.48)];
  g.userData = { legs, arms };
  return g;
}
const walker = makeWalker();
scene.add(walker);

// ---------- collision ----------
function inside(poly, x, y) {
  let c = false;
  for (let i = 0, j = poly.length - 2; i < poly.length - 1; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function segDist(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / l2)) : 0;
  return Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy);
}
function blocked(x, y) {
  for (const b of grid.get(cellKey(Math.floor(x / CELL), Math.floor(y / CELL))) || []) {
    const [x0, y0, x1, y1] = b.bbox;
    if (x < x0 - BODY_R || x > x1 + BODY_R || y < y0 - BODY_R || y > y1 + BODY_R) continue;
    if (inside(b.poly, x, y)) return true;
    for (let i = 0; i < b.poly.length - 1; i++) if (segDist(x, y, b.poly[i], b.poly[i + 1]) < BODY_R) return true;
  }
  return false;
}
function nearestBuilding(x, y) {
  let best = null, bd = 12;
  for (let a = -1; a <= 1; a++) for (let c = -1; c <= 1; c++)
    for (const b of grid.get(cellKey(Math.floor(x / CELL) + a, Math.floor(y / CELL) + c)) || []) {
      for (let i = 0; i < b.poly.length - 1; i++) { const d = segDist(x, y, b.poly[i], b.poly[i + 1]); if (d < bd) { bd = d; best = b; } }
    }
  return best;
}

// ---------- ground height on sidewalks ----------
const walkMeshes = new Map();   // tile key -> mesh
const down = new THREE.Raycaster(); down.far = 3;
function groundAt(x, y, tile) {
  const m = walkMeshes.get(`${Math.floor(x / tile)},${Math.floor(y / tile)}`);
  if (!m) return 0;
  down.set(new THREE.Vector3(x, 2, -y), new THREE.Vector3(0, -1, 0));
  const hit = down.intersectObject(m, true)[0];
  return hit ? hit.point.y : 0;
}

// ---------- input ----------
const keys = new Set();
addEventListener("keydown", (e) => { keys.add(e.code); if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault(); });
addEventListener("keyup", (e) => keys.delete(e.code));
let yaw = 0, pitch = 0.18, dist = 4.6, dragging = null;
canvas.addEventListener("pointerdown", (e) => { canvas.focus(); dragging = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - dragging[0]) * 0.005; pitch = THREE.MathUtils.clamp(pitch + (e.clientY - dragging[1]) * 0.004, -0.35, 1.2);
  dragging = [e.clientX, e.clientY];
});
canvas.addEventListener("pointerup", () => { dragging = null; });
canvas.addEventListener("wheel", (e) => { dist = THREE.MathUtils.clamp(dist + e.deltaY * 0.004, 2.2, 14); e.preventDefault(); }, { passive: false });
const stick = $("stick"), knob = stick.querySelector("i"); let stickVec = [0, 0];
stick.addEventListener("pointerdown", (e) => stick.setPointerCapture(e.pointerId));
stick.addEventListener("pointermove", (e) => {
  if (!e.buttons && e.pointerType === "mouse") return;
  const r = stick.getBoundingClientRect(); let x = (e.clientX - r.left - r.width / 2) / 45, y = (e.clientY - r.top - r.height / 2) / 45;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  stickVec = [x, -y]; knob.style.transform = `translate(${x * 35}px, ${-stickVec[1] * 35}px)`;
});
stick.addEventListener("pointerup", () => { stickVec = [0, 0]; knob.style.transform = ""; });

// ---------- main ----------
let manifest, player = { x: 0, y: 0, h: 0, heading: 0 }, lastWhere = 0;
async function main() {
  manifest = await (await fetch("manifest.json")).json();
  const tile = manifest.tile_size_m;
  const lat0 = manifest.georeference.origin_lat, lon0 = manifest.georeference.origin_lon;
  let done = 0; const total = manifest.tiles.length;
  await Promise.all(manifest.tiles.map(async (t) => {
    const [ox, oy] = t.origin_m;
    const name = `bld_${t.key[0]}_${t.key[1]}.json`;
    if (t.files.includes(name)) {
      const data = await (await fetch(`tiles/${name}`)).json();
      for (const b of data.buildings) if (b.footprint && b.footprint.length > 3) addBuilding(b, ox, oy);
    }
    for (const f of t.files.filter((x) => /^(road|walk)_.*\.glb$/.test(x))) {
      const gltf = await loader.parseAsync(await fetchGlb(`tiles/${f}.txt`), "");
      gltf.scene.traverse((o) => {
        if (!o.isMesh) return;
        const isWalk = f.startsWith("walk_");
        o.material = std({ vertexColors: true, roughness: isWalk ? 0.9 : 0.75 });
        o.receiveShadow = true;
        if (isWalk) walkMeshes.set(`${t.key[0]},${t.key[1]}`, o);
      });
      scene.add(gltf.scene);
    }
    loadMsg(`Đã dựng ${++done}/${total} ô lưới`);
  }));
  loadMsg("Đang sinh mặt tiền, cây, cột điện…");
  await new Promise((r) => setTimeout(r, 0));

  cables();
  buildChunks();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), std({ color: 0x8c877d, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // spawn on the sidewalk of a shop street nearest Hancorp Plaza, Trần Đăng Ninh (21.03832, 105.79434),
  // looking along the street
  const tx = (105.79434 - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180), ty = (21.03832 - lat0) * 110574;
  let best = null, bd = Infinity;
  for (const c of spawnEdges) {
    const d = Math.hypot(c.x - tx, c.y - ty);
    if (d < bd && !blocked(c.x, c.y)) { bd = d; best = c; }
  }
  if (best) { player.x = best.x; player.y = best.y; yaw = Math.atan2(-best.dx, best.dy); }
  else { player.x = tx; player.y = ty; }
  player.heading = yaw;

  cullChunks();
  setHour(parseFloat($("hour").value));
  $("loading").hidden = true;
  addEventListener("resize", resize); resize();
  let last = performance.now(), frames = 0, fpsT = last;
  renderer.setAnimationLoop((now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (++frames && now - fpsT > 1000) { document.body.dataset.fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    step(dt, now / 1000, tile, lat0, lon0);
    renderer.render(scene, camera);
  });
}

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }

let phase = 0;
function step(dt, t, tile, lat0, lon0) {
  let fx = 0, fz = 0;
  if (keys.has("KeyW") || keys.has("ArrowUp")) fz += 1;
  if (keys.has("KeyS") || keys.has("ArrowDown")) fz -= 1;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) fx -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) fx += 1;
  fx += stickVec[0]; fz += stickVec[1];
  const mag = Math.min(1, Math.hypot(fx, fz));
  const speed = (keys.has("ShiftLeft") || keys.has("ShiftRight") ? RUN_MS : WALK_MS) * mag;
  if (mag > 0.05) {
    // camera-relative direction in data coordinates (north = +y)
    const fwd = [-Math.sin(yaw), Math.cos(yaw)], right = [Math.cos(yaw), Math.sin(yaw)];
    let mx = fwd[0] * fz + right[0] * fx, my = fwd[1] * fz + right[1] * fx;
    const l = Math.hypot(mx, my); mx /= l; my /= l;
    const nx = player.x + mx * speed * dt, ny = player.y + my * speed * dt;
    if (!blocked(nx, ny)) { player.x = nx; player.y = ny; }
    else if (!blocked(nx, player.y)) player.x = nx;
    else if (!blocked(player.x, ny)) player.y = ny;
    const target = Math.atan2(mx, my);
    let d = target - player.heading; d = Math.atan2(Math.sin(d), Math.cos(d));
    player.heading += d * Math.min(1, dt * 10);
    phase += dt * speed * 4.2;
  } else phase *= 0.9;
  const gh = groundAt(player.x, player.y, tile);
  player.h += (gh - player.h) * Math.min(1, dt * 14);
  walker.position.set(player.x, player.h, -player.y);
  walker.rotation.y = player.heading + Math.PI;
  const swing = Math.sin(phase) * Math.min(0.7, speed / 3);
  walker.userData.legs[0].rotation.x = swing; walker.userData.legs[1].rotation.x = -swing;
  walker.userData.arms[0].rotation.x = -swing * 0.8; walker.userData.arms[1].rotation.x = swing * 0.8;

  // third-person camera: behind and above the shoulder, kept out of walls
  const head = new THREE.Vector3(player.x, player.h + 1.55, -player.y);
  let dd = dist;
  for (let s = 0.5; s <= dist; s += 0.5) {
    const cx = player.x + Math.sin(yaw) * Math.cos(pitch) * s, cy = player.y - Math.cos(yaw) * Math.cos(pitch) * s;
    if (blocked(cx, cy)) { dd = Math.max(1.2, s - 0.5); break; }
  }
  camera.position.set(head.x + Math.sin(yaw) * Math.cos(pitch) * dd, head.y + Math.sin(pitch) * dd, head.z + Math.cos(yaw) * Math.cos(pitch) * dd);
  camera.lookAt(head);

  sun.position.copy(walker.position).addScaledVector(sunDir, 160);
  sun.target.position.copy(walker.position);

  if (t - lastWhere > 0.5) {
    lastWhere = t;
    cullChunks();
    const lat = lat0 + player.y / 110574, lon = lon0 + player.x / (111320 * Math.cos(lat0 * Math.PI / 180));
    const nb = nearestBuilding(player.x, player.y);
    const label = nb ? `${nb.name ? `<b>${nb.name.replace(/[<>&]/g, "")}</b> · ` : ""}nhà cao ${nb.height.toFixed(0)} m (${{ observed: "đo trong dữ liệu", derived_floors: "từ số tầng", derived_raster: "từ raster 2.5D", estimated: "ước lượng" }[nb.source]})` : "giữa phố";
    $("where").innerHTML = `<span class="mono">${lat.toFixed(5)}, ${lon.toFixed(5)}</span> · ${label} · <a href="https://www.openstreetmap.org/#map=19/${lat.toFixed(6)}/${lon.toFixed(6)}" target="_blank" rel="noopener">đối chiếu bản đồ</a>`;
  }
}

main().catch((e) => { loadMsg(`Không dựng được phố: ${e.message}`); });
</script>
