name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Game content matches its schemas and references resolve
        run: python tools/validate.py
      - name: Generated UE types are up to date
        run: |
          python tools/codegen_ue.py
          git diff --exit-code -- ue5/
      - name: Generated Unity types are up to date
        run: |
          python tools/codegen_unity.py
          git diff --exit-code -- unity/
      - name: Unit tests
        run: python -m pytest -q
      - name: Runtime rules golden file (minigames, flood) is up to date
        run: python tools/runtime_rules.py --check
      - name: Story dry run reaches every mission (no dead ends)
        run: python tools/playtest.py > /dev/null
      - name: Asset prompt pack matches the asset contract
        run: python tools/asset_prompts.py --check
  unity-core:
    # The engine-free C# core of the Unity harness (unity/Packages/com.vncity.hanoicity/Runtime/Core)
    # compiled and tested with plain .NET against the real game/content: no Unity needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and test the Unity core
        run: dotnet test unity/dotnet --nologo
