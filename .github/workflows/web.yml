name: web
# Bản web three.js "Hà Nội Dạo Phố" (web/): kiểm tra bộ sinh thành phố, build, kiểm thử khói trong Chromium,
# đưa lên GitHub Pages khi vào main. Bản đồ (OSM, Overture) và mô hình đã nằm sẵn trong repo nên build không cần mạng ngoài npm.
on:
  push:
    branches: [main]
    paths: ['web/**', 'game/content/world/landmarks.json', 'viewer/assets/walker.glb', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'game/content/world/landmarks.json', 'viewer/assets/walker.glb', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Điểm đóng dấu khớp với nội dung game (landmarks.json)
        run: |
          node tools/build_places.mjs
          git diff --exit-code -- public/world/places.json
      - name: Bộ sinh thành phố dựng được mọi ô phố, trong ngân sách tam giác
        run: node tools/gen_check.mjs
      - name: Xưởng vẽ soát lỗi mọi mô hình thủ tục (ngân sách tam giác, toạ độ hỏng)
        run: node tools/studio.mjs
      - run: npm run build
      - name: Kiểm thử khói trong Chromium (SwiftShader)
        run: |
          npx playwright install --with-deps chromium
          node tools/smoke.mjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: web/shots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
