name: web
# Bản web three.js "Hà Nội Dạo Phố" (web/): build, kiểm thử khói trong Chromium, đưa lên GitHub Pages khi vào main.
on:
  push:
    branches: [main]
    paths: ['web/**', 'game/content/world/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'game/content/world/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
env:
  # Mô hình CC0 và bản đồ OSM lấy từ craft-anything, ghim theo commit để build lặp lại được.
  CRAFT_REPO: vansyson1308/craft-anything
  CRAFT_REF: d658c617e2eaeb32a3cbb925cf78f94cd35e8638
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CRAFT_REPO }}
          ref: ${{ env.CRAFT_REF }}
          path: craft-anything
          sparse-checkout: examples/game-hanoi-city/assets
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Đóng gói tài nguyên (WebP + meshopt)
        run: node tools/build_assets.mjs
        env:
          CRAFT_DIR: ${{ github.workspace }}/craft-anything
      - run: npm run build
      - name: Kiểm thử khói trong Chromium (SwiftShader)
        run: |
          npx playwright install --with-deps chromium
          VIEWS=start node tools/smoke.mjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: web/shots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
