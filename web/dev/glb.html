<!doctype html><meta charset="utf-8"><body style="margin:0;background:#789"><canvas id="c" width="1200" height="800"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8899aa);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 3); scene.add(d);
const cam = new THREE.PerspectiveCamera(35, 1.5, 0.05, 100);
const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
const g = await l.loadAsync(q.get('f') || '/models/human.glb');
const info = { anims: g.animations.map((a) => [a.name, +a.duration.toFixed(2)]), nodes: [] };
g.scene.traverse((o) => { if (o.isMesh) info.nodes.push([o.name, o.type, o.geometry.attributes.position.count, o.material.name, o.parent?.name]); });
g.scene.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(g.scene); info.box = [box.min.toArray().map((v) => +v.toFixed(2)), box.max.toArray().map((v) => +v.toFixed(2))];
info.rootScale = g.scene.children.map((c) => [c.name, c.scale.toArray(), c.rotation.toArray().slice(0, 3)]);
// ba bản: trước, nghiêng, sau
const mixer = new THREE.AnimationMixer(g.scene);
const clip = g.animations.find((a) => a.name === (q.get('a') || 'idle')); if (clip) mixer.clipAction(clip).play(); mixer.update(+(q.get('t') || 0.3));
scene.add(g.scene);
const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length();
const ang = +(q.get('ang') || 0.5);
cam.position.set(c.x + Math.sin(ang) * s * 1.1, c.y + s * 0.15, c.z + Math.cos(ang) * s * 1.1); cam.lookAt(c);
r.render(scene, cam); window.__info = info; document.title = 'ready';
</script>
