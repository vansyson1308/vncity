<!doctype html><meta charset="utf-8"><title>Xưởng vẽ</title><link rel="icon" href="data:,">
<body style="margin:0;background:#1b1d22;overflow:hidden;font:13px/1.45 ui-monospace,Menlo,monospace;color:#e8e4d8">
<canvas id="c"></canvas>
<div id="info" style="position:fixed;left:10px;top:8px;background:#000a;padding:8px 11px;border-radius:8px;max-width:46vw;white-space:pre-wrap"></div>
<div id="labels"></div>
<script type="module">
// Xưởng vẽ: soi một mô hình thủ tục bằng đúng vật liệu, ánh sáng của game, kèm thước đo và bộ soát lỗi.
//   /dev/studio.html?m=lm:thap_rua            bảng 6 góc: 3/4, chính diện, mặt bên, ban đêm, cận cảnh phần trên, cận cảnh chân công trình
//   &view=hero|front|side|back|top|night|upper|base      một góc toàn màn hình        &ang=0.6&el=0.2&d=1.1   tự chỉnh góc máy
//   &h=15.5 giờ trong ngày   &tags tô màu theo chất liệu   &wire khung lưới   &zoom=x,y,z,r  soi gần một điểm
// Thước: lưới sàn 1 m (vạch đậm 10 m), người mẫu cao 1,7 m đứng cạnh. tools/studio.mjs chụp hàng loạt và soát lỗi.
import * as THREE from 'three';
import { Sky, skyU } from '../src/engine/sky.js';
import { buildMaterials, propGeometry } from '../src/world/materials.js';
import { signAtlas } from '../src/world/atlas.js';
import { QUALITY } from '../src/config.js';
import { G, MAT } from '../src/core/geo.js';
import { buildModel, BUDGET } from './models.js';
import { lint, MAT_NAMES } from './lint.js';

const q = new URLSearchParams(location.search), name = q.get('m') || 'lm:thap_rua', isLm = name.startsWith('lm:');
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.autoClear = false;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(32, 1, 0.1, 4000);
const atlas = await signAtlas(r, 8), M = buildMaterials(r, QUALITY.high, atlas);
const g = new G(), lf = new G();
const mods = import.meta.glob('../src/world/landmarks/*.js');
await buildModel(name, g, lf, (id) => mods[`../src/world/landmarks/${id}.js`]());
const pack = g.pack(), report = lint(pack, { budget: BUDGET[name] || 8000 });
const box = new THREE.Box3(new THREE.Vector3(pack.box[0], pack.box[1], pack.box[2]), new THREE.Vector3(pack.box[3], pack.box[4], pack.box[5]));
const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3()), rad = size.length() / 2;
const sky = new Sky(scene, cam, { ...QUALITY.high, fog: 0.0002, shadowRange: Math.max(20, rad * 1.3) });

let mesh;
if (q.has('tags')) { // tô màu theo chất liệu để xem mặt nào đã gắn gì
  const PAL = [[0.55, 0.55, 0.55], [0.8, 0.3, 0.2], [0.6, 0.6, 0.7], [0.95, 0.85, 0.4], [0.9, 0.45, 0.1], [0.5, 0.3, 0.15], [0.45, 0.2, 0.1], [0.75, 0.75, 0.75], [0.3, 0.6, 0.3], [0.8, 0.4, 0.4], [0.7, 0.1, 0.15]];
  const geo = propGeometry(pack), col = new Float32Array(pack.pos.length);
  for (let i = 0; i < pack.pos.length / 3; i++) { const p = PAL[Math.round(pack.fx[i * 4 + 3] / 16)] || PAL[0]; col.set(p, i * 3); }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.2));
} else mesh = new THREE.Mesh(propGeometry(pack), isLm ? M.landmark : M.prop);
mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
if (q.has('wire')) { const w = new THREE.LineSegments(new THREE.WireframeGeometry(mesh.geometry), new THREE.LineBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.35 })); scene.add(w); }
if (lf.count) { const lm = new THREE.Mesh(propGeometry(lf.pack()), M.leaf); lm.castShadow = true; scene.add(lm); }

// sàn có lưới 1 m, người mẫu 1,7 m
{ const gg = new G(), E = Math.ceil(rad * 3 / 10) * 10 + 20; gg.rgb(0.33, 0.34, 0.33).quad([-E, -0.01, E], [E, -0.01, E], [E, -0.01, -E], [-E, -0.01, -E]);
  const fl = new THREE.Mesh(propGeometry(gg.pack()), M.prop); fl.receiveShadow = true; scene.add(fl);
  const pts = []; for (let i = -E; i <= E; i++) { pts.push(-E, 0.005, i, E, 0.005, i, i, 0.005, -E, i, 0.005, E); }
  const mk = (arr, op) => { const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: op }))); };
  mk(pts, 0.07); const p10 = []; for (let i = -E; i <= E; i += 10) p10.push(-E, 0.006, i, E, 0.006, i, i, 0.006, -E, i, 0.006, E); mk(p10, 0.22);
  const h = new G(); h.push().move(box.max.x + 1.2, 0, box.max.z + 0.6); h.rgb(0.16, 0.2, 0.32).cyl(-0.1, 0, 0, 0.075, 0.085, 0.86, 6).cyl(0.1, 0, 0, 0.075, 0.085, 0.86, 6); h.rgb(0.75, 0.75, 0.72).cyl(0, 0.84, 0, 0.19, 0.2, 0.62, 8); h.rgb(0.78, 0.6, 0.48).ball(0, 1.58, 0, 0.115, 8, 6); h.pop();
  const hm = new THREE.Mesh(propGeometry(h.pack()), M.prop); hm.castShadow = true; scene.add(hm); }

const H = +(q.get('h') || 15.5), zoom = q.get('zoom') ? q.get('zoom').split(',').map(Number) : null;
const fit = (rr) => (rr / Math.tan((cam.fov * Math.PI) / 360)) * +(q.get('d') || 1);
// khung hình ôm theo chiều lớn nhất nhìn thấy được (không tính đường chéo hộp bao, kẻo mô hình bé tí giữa khung)
const span = Math.max(size.y, Math.hypot(size.x, size.z) * 0.62) / 2 * 1.08;
const tgt = zoom ? new THREE.Vector3(zoom[0], zoom[1], zoom[2]) : c.clone(), dist = fit(zoom ? zoom[3] : span);
// mỗi góc: [góc quay, góc ngẩng, giờ, điểm ngắm (tuỳ chọn), khoảng cách (tuỳ chọn)]
const VIEWS = { hero: [0.62, 0.2, H], front: [0, 0.06, H], side: [Math.PI / 2, 0.06, H], back: [Math.PI + 0.62, 0.2, H], top: [0.3, 1.25, H], night: [0.62 + Math.PI * 0.5, 0.16, 20.5],
  // cận cảnh: nửa trên công trình và chân công trình ngang tầm mắt người (soi chất liệu ở cự ly người chơi nhìn thấy)
  upper: [0.5, 0.12, H, new THREE.Vector3(c.x, box.min.y + size.y * 0.74, c.z), fit(Math.max(2.5, size.y * 0.2))],
  base: [0.35, 0.03, H, new THREE.Vector3(c.x, Math.max(0, box.min.y) + 1.9, c.z), fit(3.4) + Math.min(size.x, size.z) * 0.5] };
if (q.has('ang')) VIEWS.hero = [+q.get('ang'), +(q.get('el') || 0.2), H];
const view = q.get('view') || 'sheet', cells = view === 'sheet' ? ['hero', 'front', 'side', 'night', 'upper', 'base'] : [view];
const lab = document.getElementById('labels'), LBL = { hero: '3/4', front: 'chính diện', side: 'mặt bên', back: 'phía sau', top: 'trên xuống', night: 'ban đêm (20:30)', upper: 'cận cảnh phần trên', base: 'cận cảnh chân công trình' };
const info = document.getElementById('info');
info.textContent = `${name}   ${report.tris} tam giác / ${BUDGET[name] || 8000}   ${report.verts} đỉnh\nkích thước ${report.size.join(' × ')} m (rộng × cao × sâu)   đáy y=${report.minY}\nchất liệu: ${Object.entries(report.mats).map(([k, v]) => `${k} ${v}%`).join(', ')}` + (report.err.length ? '\nLỖI: ' + report.err.join('; ') : '') + (report.warn.length ? '\n⚠ ' + report.warn.join('\n⚠ ') : '\n✓ không có cảnh báo');
window.__lint = report; window.__info = report;
let n = 0;
function frame() {
  const W = innerWidth, Hh = innerHeight, cols = cells.length > 1 ? 3 : 1, rows = cells.length > 1 ? 2 : 1;
  r.setScissorTest(true); lab.innerHTML = '';
  cells.forEach((k, i) => {
    const [ang, el, hr, vt, vd] = VIEWS[k] || VIEWS.hero, T = vt && !zoom ? vt : tgt, D = vd && !zoom ? vd : dist, cw = W / cols, ch = Hh / rows, cx = (i % cols) * cw, cy = Hh - (Math.floor(i / cols) + 1) * ch;
    sky.setHours(hr); cam.aspect = cw / ch; cam.updateProjectionMatrix();
    cam.position.set(T.x + Math.sin(ang) * Math.cos(el) * D, T.y + Math.sin(el) * D, T.z + Math.cos(ang) * Math.cos(el) * D); cam.lookAt(T); cam.updateMatrixWorld();
    sky.update(0, c); r.shadowMap.needsUpdate = true; r.toneMappingExposure = sky.exposure;
    r.setViewport(cx, cy, cw, ch); r.setScissor(cx, cy, cw, ch); r.clear(); r.render(scene, cam);
    if (cells.length > 1) lab.insertAdjacentHTML('beforeend', `<div style="position:fixed;left:${cx + cw - 150}px;top:${Hh - cy - 26}px;width:140px;text-align:right;color:#fff;text-shadow:0 1px 3px #000">${LBL[k] || k}</div>`);
  });
  skyU.uTime.value += 0.016;
  if (++n === 4) { document.title = 'ready'; window.__ready = true; }
  requestAnimationFrame(frame);
}
frame();
</script>
